<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Garden DSA Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-gray-100 p-4 max-w-lg mx-auto text-gray-800 text-xs space-y-3">

  <header class="text-center space-y-1">
    <h1 class="text-lg font-bold text-emerald-900 flex justify-center items-center gap-1">
      <i data-lucide="sprout" class="w-5 h-5"></i> Garden DSA Simulation
    </h1>
    <div class="flex justify-between items-center bg-amber-100 border border-amber-300 p-2 rounded">
      <span id="status" class="text-amber-700 font-semibold">Initializing Pyodide...</span>
      <span class="font-bold text-amber-900 text-sm flex items-center gap-1">
        <i data-lucide="coins" class="w-4 h-4 text-amber-600"></i> Gold: <span id="gold-val">0</span>
      </span>
    </div>
  </header>

  <main class="space-y-3">
    <!-- 1. STACK -->
    <section class="bg-white p-3 border rounded space-y-1.5">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-emerald-800 flex items-center gap-1">
          <i data-lucide="layers" class="w-3.5 h-3.5"></i> 1. Stack (LIFO Undo)
        </h2>
        <button onclick="undoAction()" class="bg-red-700 text-white px-2 py-0.5 rounded font-bold hover:bg-red-800">Undo</button>
      </div>
      <div id="stack-box" class="font-mono bg-gray-50 p-1.5 border rounded min-h-[28px]">Empty</div>
    </section>

    <!-- 2. QUEUE -->
    <section class="bg-white p-3 border rounded space-y-1.5">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="clock" class="w-3.5 h-3.5"></i> 2. Queue (FIFO Execution)
      </h2>
      <div id="queue-box" class="font-mono bg-gray-50 p-1.5 border rounded min-h-[28px]">Idle</div>
    </section>

    <!-- 3. MATRIX -->
    <section class="bg-white p-3 border rounded space-y-2">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="grid" class="w-3.5 h-3.5"></i> 3. Grid Matrix (3x3 Land)
      </h2>
      <div id="grid-box" class="grid grid-cols-3 gap-1.5 w-fit mx-auto"></div>
      
      <div id="controls" class="hidden bg-emerald-50 p-2 border rounded text-center space-y-1">
        <div id="target-label" class="font-bold text-emerald-900">Selected Plot: (0,0)</div>
        <div class="flex justify-center gap-1.5">
          <button id="btn-soil" onclick="doAction('Soil')" class="bg-amber-800 text-white px-2 py-1 rounded font-semibold hover:bg-amber-900">Soil</button>
          <button id="btn-plant" onclick="doAction('Plant')" class="bg-emerald-600 text-white px-2 py-1 rounded font-semibold hover:bg-emerald-700">Plant</button>
          <button id="btn-water" onclick="doAction('Water')" class="bg-blue-600 text-white px-2 py-1 rounded font-semibold hover:bg-blue-700">Water</button>
        </div>
      </div>
    </section>

    <!-- 4. TREE -->
    <section class="bg-white p-3 border rounded space-y-1.5">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="git-branch" class="w-3.5 h-3.5"></i> 4. Skill & Growth Tree
      </h2>
      <div id="tree-box" class="font-mono bg-gray-50 p-2 border rounded space-y-1 overflow-x-auto text-[11px]"></div>
    </section>

    <!-- 5. TREE TRAVERSAL NAVIGATOR -->
    <section class="bg-white p-3 border rounded space-y-2">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="compass" class="w-3.5 h-3.5"></i> 5. Tree Traversal Navigator
      </h2>
      <div class="flex flex-wrap gap-1 items-center">
        <span class="text-gray-600 font-semibold mr-1">Mode:</span>
        <button onclick="setTraversalMode('bfs')" id="btn-bfs" class="px-2 py-0.5 border rounded font-semibold bg-emerald-700 text-white">BFS</button>
        <button onclick="setTraversalMode('preorder')" id="btn-preorder" class="px-2 py-0.5 border rounded font-semibold bg-gray-100 text-gray-800">Preorder</button>
        <button onclick="setTraversalMode('inorder')" id="btn-inorder" class="px-2 py-0.5 border rounded font-semibold bg-gray-100 text-gray-800">Inorder</button>
        <button onclick="setTraversalMode('postorder')" id="btn-postorder" class="px-2 py-0.5 border rounded font-semibold bg-gray-100 text-gray-800">Postorder</button>
        <button onclick="startTraversal()" class="bg-amber-600 text-white px-3 py-0.5 rounded font-bold hover:bg-amber-700 ml-auto">Traverse</button>
      </div>
      <div id="nav-display" class="bg-gray-50 p-2 border rounded font-mono text-[11px] space-y-1 min-h-[50px]">
        Select a mode and click "Traverse" to begin.
      </div>
      <div class="flex justify-between items-center">
        <div class="space-x-1">
          <button id="nav-prev" onclick="traversalPrev()" disabled class="bg-gray-400 text-white px-2 py-0.5 rounded font-bold cursor-not-allowed">Prev</button>
          <button id="nav-next" onclick="traversalNext()" disabled class="bg-gray-400 text-white px-2 py-0.5 rounded font-bold cursor-not-allowed">Next</button>
        </div>
        <button id="nav-unlock" onclick="unlockHighlightedNode()" disabled class="bg-gray-400 text-white px-3 py-0.5 rounded font-bold cursor-not-allowed">Unlock Selected</button>
      </div>
    </section>
  </main>

  <!-- PYTHON CODE WORKBENCH -->
  <section class="bg-white border rounded overflow-hidden">
    <div class="bg-gray-800 text-white px-3 py-1.5 font-bold flex justify-between items-center">
      <span class="flex items-center gap-1">
        <i data-lucide="code" class="w-3.5 h-3.5 text-emerald-400"></i> Python Initializer
      </span>
      <button onclick="confirmAndRunPython()" class="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold hover:bg-emerald-700">Apply Code</button>
    </div>
    <div class="p-2">
      <textarea id="python-code" class="w-full h-40 font-mono bg-gray-900 text-emerald-400 p-2 rounded" spellcheck="false"></textarea>
    </div>
  </section>

  <script>
    let py = null, selectedCell = null, timerRunning = false, gold = 0;
    let history_stack = [], execution_queue = [];
    let plot_matrix = Array(3).fill(null).map(() => 
      Array(3).fill(null).map(() => ({ status: "Empty", timer: 0, timerId: null, hasPlant: false, isWatered: false }))
    );
    let speeds = { Soil: 2.0, Water: 1.0, Plant: 3.0 };
    let growthTime = 5, treeRoot = null;

    // Traversal state variables
    let currentTraversalMode = 'bfs';
    let traversalSequence = [];
    let traversalIndex = 0;
    let traversalActive = false;

    const initialPythonCode = `class Node:
    def __init__(self, id_str, name, action=None, speed=None, growth_time=None, cost=10):
        self.id = id_str
        self.name = name
        self.action = action
        self.speed = speed
        self.growth_time = growth_time
        self.cost = cost
        self.unlocked = False
        self.children = []

root = Node("root", "Root Node", cost=0)

soil = Node("soil", "Learned: Soil", "Soil", 2.0, cost=5)
water = Node("water", "Learned: Water", "Water", 1.0, cost=10)
plant = Node("plant", "Learned: Plant", "Plant", 3.0, cost=10)
growth = Node("growth", "Base Growth", growth_time=5, cost=10)

fast_soil = Node("fast_soil", "Fast Soil", "Soil", 1.0, cost=15)
fast_water = Node("fast_water", "Fast Water", "Water", 0.5, cost=15)
fast_plant = Node("fast_plant", "Fast Plant", "Plant", 1.5, cost=15)
fast_growth = Node("fast_growth", "Fast Growth", growth_time=3, cost=20)

super_soil = Node("super_soil", "Super Soil", "Soil", 0.3, cost=30)
super_water = Node("super_water", "Super Water", "Water", 0.2, cost=30)
super_plant = Node("super_plant", "Super Plant", "Plant", 0.5, cost=30)
super_growth = Node("super_growth", "Super Growth", growth_time=1, cost=40)

root.children = [soil, water, plant, growth]
soil.children = [fast_soil]
fast_soil.children = [super_soil]
water.children = [fast_water]
fast_water.children = [super_water]
plant.children = [fast_plant]
fast_plant.children = [super_plant]
growth.children = [fast_growth]
fast_growth.children = [super_growth]

def serialize(node):
    return {
        "id": node.id, "name": node.name, "action": node.action,
        "speed": node.speed, "growth_time": node.growth_time,
        "cost": node.cost, "unlocked": node.unlocked,
        "children": [serialize(c) for c in node.children]
    }

tree = serialize(root)`;

    async function start() {
      document.getElementById('python-code').value = initialPythonCode;
      py = await loadPyodide();
      await runPython();
      document.getElementById('status').innerText = "Pyodide Active";
      document.getElementById('status').className = "text-amber-800 font-semibold";
      drawGrid();
      updateGoldUI();
      lucide.createIcons();
    }

    async function runPython() {
      try {
        await py.runPythonAsync(document.getElementById('python-code').value);
        let rawTree = py.runPython("tree");
        treeRoot = rawTree.toJs({ dict_converter: Object.fromEntries });
        syncTreeEffects();
        drawTree();
        resetTraversalState();
      } catch (err) { alert("Python Error: " + err); }
    }

    async function confirmAndRunPython() {
      let userConfirmed = confirm("Applying new Python code will reset the game state. Continue?");
      if (!userConfirmed) return;
      gold = 0; history_stack = []; execution_queue = []; selectedCell = null;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (plot_matrix[r][c].timerId) clearInterval(plot_matrix[r][c].timerId);
        }
      }
      plot_matrix = Array(3).fill(null).map(() => 
        Array(3).fill(null).map(() => ({ status: "Empty", timer: 0, timerId: null, hasPlant: false, isWatered: false }))
      );
      document.getElementById('controls').classList.add('hidden');
      await runPython();
      drawGrid(); drawStack(); drawQueue(); updateGoldUI();
    }

    function updateGoldUI() { document.getElementById('gold-val').innerText = gold; }

    function undoAction() {
      history_stack = history_stack.filter(item => {
        let p = plot_matrix[item.r][item.c];
        return p.status !== 'Growing...' && p.status !== 'Gold Harvestable!';
      });
      if (history_stack.length === 0) { alert("Nothing valid to undo!"); return; }
      let lastTask = history_stack.pop();
      let { r, c, act } = lastTask;
      let plot = plot_matrix[r][c];
      if (act === 'Plant' || act === 'Water') {
        if (act === 'Plant') plot.hasPlant = false;
        if (act === 'Water') plot.isWatered = false;
        if (plot.hasPlant) plot.status = 'Soil + Plant';
        else if (plot.isWatered) plot.status = 'Watered Soil';
        else plot.status = 'Soil';
      } else if (act === 'Soil') {
        if (plot.timerId) clearInterval(plot.timerId);
        plot_matrix[r][c] = { status: 'Empty', timer: 0, timerId: null, hasPlant: false, isWatered: false };
      }
      execution_queue = execution_queue.filter(i => i !== lastTask);
      drawStack(); drawQueue(); drawGrid();
    }

    function doAction(act) {
      if (!selectedCell) return;
      let r = selectedCell.r, c = selectedCell.c, plot = plot_matrix[r][c];
      if (!treeRoot || !treeRoot.unlocked) return alert("Unlock Root Node first!");
      if (act === 'Soil' && plot.status !== 'Empty' && plot.status !== 'Gold Harvestable!') return alert("Plot already has soil or crops!");
      if (act === 'Plant') {
        if (plot.status === 'Empty') return alert("Cannot plant without soil first!");
        if (plot.hasPlant) return alert("Plot already has a plant!");
      }
      if (act === 'Water') {
        if (plot.status === 'Empty') return alert("Cannot water empty land!");
        if (plot.isWatered) return alert("Plot already watered!");
      }
      let task = { r, c, act, time: speeds[act] };
      history_stack.push(task); execution_queue.push(task);
      drawStack(); drawQueue();
      if (!timerRunning) runWorker();
    }

    function runWorker() {
      if (execution_queue.length === 0) { timerRunning = false; drawQueue(); return; }
      timerRunning = true;
      let task = execution_queue[0];
      drawQueue();
      setTimeout(() => {
        let done = execution_queue.shift();
        if (done) applyPlotChange(done.r, done.c, done.act);
        drawGrid(); drawQueue(); runWorker();
      }, task.time * 1000);
    }

    function applyPlotChange(r, c, act) {
      let plot = plot_matrix[r][c];
      if (act === 'Soil') {
        if (plot.timerId) clearInterval(plot.timerId);
        plot_matrix[r][c] = { status: 'Soil', timer: 0, timerId: null, hasPlant: false, isWatered: false };
      } else if (act === 'Plant') {
        plot.hasPlant = true;
        if (plot.isWatered) startGrowthTimer(plot);
        else plot.status = 'Soil + Plant';
      } else if (act === 'Water') {
        plot.isWatered = true;
        if (plot.hasPlant) startGrowthTimer(plot);
        else plot.status = 'Watered Soil';
      }
    }

    function startGrowthTimer(plot) {
      plot.status = 'Growing...';
      plot.timer = typeof growthTime === 'number' && !isNaN(growthTime) ? growthTime : 5;
      if (plot.timerId) clearInterval(plot.timerId);
      plot.timerId = setInterval(() => {
        plot.timer--;
        if (plot.timer <= 0) {
          clearInterval(plot.timerId); plot.timerId = null; plot.status = 'Gold Harvestable!';
        }
        drawGrid();
      }, 1000);
    }

    function harvestGold(r, c) {
      gold += 15; updateGoldUI();
      plot_matrix[r][c] = { status: 'Soil', timer: 0, timerId: null, hasPlant: false, isWatered: false };
      drawGrid();
    }

    function drawQueue() {
      let box = document.getElementById('queue-box');
      if (execution_queue.length === 0) { box.innerText = "Idle"; return; }
      box.innerHTML = execution_queue.map((i, idx) => `<div>${idx === 0 ? '►' : '•'} (${i.r},${i.c}): ${i.act} (${i.time}s)</div>`).join('');
    }

    function drawGrid() {
      let box = document.getElementById('grid-box'); box.innerHTML = '';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          let plot = plot_matrix[r][c], isSel = selectedCell && selectedCell.r === r && selectedCell.c === c;
          let isGold = plot.status === 'Gold Harvestable!', btn = document.createElement('button');
          btn.className = `w-16 h-16 rounded text-[10px] font-bold border flex flex-col items-center justify-center p-0.5 transition ${
            isSel ? 'border-amber-500 border-2' : 'border-gray-300'
          } ${
            isGold ? 'bg-amber-400 text-amber-950 animate-pulse' :
            plot.status.includes('Soil') ? 'bg-amber-800 text-amber-100' :
            plot.status.includes('Growing') ? 'bg-emerald-700 text-white' :
            plot.status === 'Watered Soil' ? 'bg-blue-600 text-white' : 'bg-amber-50 text-amber-900'
          }`;
          let subText = plot.status;
          if (plot.status === 'Growing...') subText = `🌱 (${plot.timer}s)`;
          if (isGold) subText = `💰 CLICK!`;
          btn.innerHTML = `(${r},${c})<br><span class="text-[9px] font-normal">${subText}</span>`;
          btn.onclick = () => {
            if (isGold) return harvestGold(r, c);
            selectedCell = { r, c }; drawGrid();
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('target-label').innerText = `Selected Plot: (${r}, ${c})`;
          };
          box.appendChild(btn);
        }
      }
    }

    function syncTreeEffects() {
      if (!treeRoot) return;
      let q = [treeRoot];
      while (q.length > 0) {
        let curr = q.shift();
        if (curr.unlocked) {
          if (curr.action && curr.speed != null && !isNaN(Number(curr.speed))) speeds[curr.action] = Number(curr.speed);
          if (curr.growth_time != null && !isNaN(Number(curr.growth_time))) growthTime = Number(curr.growth_time);
        }
        if (curr.children) q.push(...curr.children);
      }
      document.getElementById('btn-soil').innerText = `Soil (${speeds.Soil}s)`;
      document.getElementById('btn-water').innerText = `Water (${speeds.Water}s)`;
      document.getElementById('btn-plant').innerText = `Plant (${speeds.Plant}s)`;
    }

    // --- Cumulative Level-Gate Helper Functions ---
    function getNodesAtDepth(node, targetDepth, currentDepth = 0, res = []) {
      if (!node) return res;
      if (currentDepth === targetDepth) {
        res.push(node);
      } else if (currentDepth < targetDepth && node.children) {
        for (let c of node.children) {
          getNodesAtDepth(c, targetDepth, currentDepth + 1, res);
        }
      }
      return res;
    }

    function getNodeDepthAndTarget(root, targetId, currentDepth = 0) {
      if (!root) return null;
      if (root.id === targetId) return { node: root, depth: currentDepth };
      if (root.children) {
        for (let c of root.children) {
          let res = getNodeDepthAndTarget(c, targetId, currentDepth + 1);
          if (res) return res;
        }
      }
      return null;
    }

    function clickUnlockNode(nodeId) {
      if (!treeRoot) return;
      
      let info = getNodeDepthAndTarget(treeRoot, nodeId);
      if (!info) return;

      let targetNode = info.node;
      let depth = info.depth;

      if (targetNode.unlocked) return alert("Already unlocked!");
      if (gold < targetNode.cost) return alert(`Need ${targetNode.cost} Gold.`);

      // Cumulative Rule: To unlock a node at depth D, ALL nodes at depth D-1 must be unlocked!
      if (depth > 0) {
        let prevLevelNodes = getNodesAtDepth(treeRoot, depth - 1);
        let allPrevUnlocked = prevLevelNodes.every(n => n.unlocked);
        if (!allPrevUnlocked) {
          return alert(`Level Gate: You must unlock ALL nodes in level ${depth} first!`);
        }
      }

      gold -= targetNode.cost;
      targetNode.unlocked = true;
      updateGoldUI();
      syncTreeEffects(); 
      drawTree(); 
      if (traversalActive) updateNavDisplay();
    }

    function drawTree() {
      if (!treeRoot) return;
      let container = document.getElementById('tree-box'); container.innerHTML = '';
      let highlightedNodeId = (traversalActive && traversalSequence.length > 0) ? traversalSequence[traversalIndex].id : null;

      function render(node, level = 0) {
        let row = document.createElement('div'); row.style.paddingLeft = `${level * 16}px`; row.className = "my-0.5";
        let statusText = node.unlocked ? "[ON]" : "[OFF]";
        let effectText = node.speed ? ` (${node.speed}s act)` : node.growth_time ? ` (${node.growth_time}s growth)` : '';
        let costText = node.cost > 0 ? ` - ${node.cost}g` : ' - FREE';
        
        let isHighlighted = (node.id === highlightedNodeId);

        let btn = document.createElement('button');
        btn.className = `px-2 py-1 rounded text-left border font-mono text-[11px] transition ${
          isHighlighted ? 'ring-2 ring-amber-500 bg-amber-50 font-bold border-amber-600' :
          node.unlocked ? 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100'
        }`;
        btn.innerHTML = `<b>${statusText}</b> ${node.name}${effectText}${costText}`;
        btn.onclick = () => clickUnlockNode(node.id);
        row.appendChild(btn); container.appendChild(row);
        if (node.children) { for (let c of node.children) render(c, level + 1); }
      }
      render(treeRoot);
    }

    // --- Traversal Algorithms & Navigator Logic ---
    function setTraversalMode(mode) {
      currentTraversalMode = mode;
      ['bfs', 'preorder', 'inorder', 'postorder'].forEach(m => {
        let btn = document.getElementById(`btn-${m}`);
        if (btn) {
          btn.className = m === mode ? "px-2 py-0.5 border rounded font-semibold bg-emerald-700 text-white" : "px-2 py-0.5 border rounded font-semibold bg-gray-100 text-gray-800";
        }
      });
      resetTraversalState();
    }

    function resetTraversalState() {
      traversalActive = false;
      traversalSequence = [];
      traversalIndex = 0;

      let prevBtn = document.getElementById('nav-prev');
      let nextBtn = document.getElementById('nav-next');
      let unlockBtn = document.getElementById('nav-unlock');

      if (prevBtn) { prevBtn.disabled = true; prevBtn.className = "bg-gray-400 text-white px-2 py-0.5 rounded font-bold cursor-not-allowed"; }
      if (nextBtn) { nextBtn.disabled = true; nextBtn.className = "bg-gray-400 text-white px-2 py-0.5 rounded font-bold cursor-not-allowed"; }
      if (unlockBtn) { unlockBtn.disabled = true; unlockBtn.className = "bg-gray-400 text-white px-3 py-0.5 rounded font-bold cursor-not-allowed"; }

      document.getElementById('nav-display').innerText = `Mode: ${currentTraversalMode.toUpperCase()}. Click "Traverse" to start.`;
      drawTree();
    }

    function startTraversal() {
      traversalActive = true;
      if (currentTraversalMode === 'bfs') traversalSequence = getBFSSequence(treeRoot);
      else if (currentTraversalMode === 'preorder') traversalSequence = getPreorderSequence(treeRoot);
      else if (currentTraversalMode === 'inorder') traversalSequence = getInorderSequence(treeRoot);
      else if (currentTraversalMode === 'postorder') traversalSequence = getPostorderSequence(treeRoot);

      traversalIndex = 0;

      let prevBtn = document.getElementById('nav-prev');
      let nextBtn = document.getElementById('nav-next');
      let unlockBtn = document.getElementById('nav-unlock');

      prevBtn.disabled = false;
      prevBtn.className = "bg-gray-700 text-white px-2 py-0.5 rounded font-bold hover:bg-gray-800";
      
      nextBtn.disabled = false;
      nextBtn.className = "bg-gray-700 text-white px-2 py-0.5 rounded font-bold hover:bg-gray-900";
      
      unlockBtn.disabled = false;
      unlockBtn.className = "bg-emerald-700 text-white px-3 py-0.5 rounded font-bold hover:bg-emerald-800";

      updateNavDisplay();
      drawTree();
    }

    function getBFSSequence(root) {
      if (!root) return [];
      let res = [], q = [root];
      while (q.length > 0) {
        let curr = q.shift();
        res.push(curr);
        if (curr.children) q.push(...curr.children);
      }
      return res;
    }

    function getPreorderSequence(node, res = []) {
      if (!node) return res;
      res.push(node);
      if (node.children) {
        for (let c of node.children) getPreorderSequence(c, res);
      }
      return res;
    }

    function getPostorderSequence(node, res = []) {
      if (!node) return res;
      if (node.children) {
        for (let c of node.children) getPostorderSequence(c, res);
      }
      res.push(node);
      return res;
    }

    function getInorderSequence(node, res = []) {
      if (!node) return res;
      if (!node.children || node.children.length === 0) {
        res.push(node);
        return res;
      }
      getInorderSequence(node.children[0], res);
      res.push(node);
      for (let i = 1; i < node.children.length; i++) {
        getInorderSequence(node.children[i], res);
      }
      return res;
    }

    function traversalNext() {
      if (!traversalActive || traversalSequence.length === 0) return;
      if (traversalIndex < traversalSequence.length - 1) {
        traversalIndex++;
        updateNavDisplay();
        drawTree();
      }
    }

    function traversalPrev() {
      if (!traversalActive || traversalSequence.length === 0) return;
      if (traversalIndex > 0) {
        traversalIndex--;
        updateNavDisplay();
        drawTree();
      }
    }

    function updateNavDisplay() {
      let box = document.getElementById('nav-display');
      if (!traversalActive || traversalSequence.length === 0) {
        box.innerText = "Click 'Traverse' to begin sequence.";
        return;
      }
      let currNode = traversalSequence[traversalIndex];
      let statusText = currNode.unlocked ? "[UNLOCKED]" : "[LOCKED]";
      let effectText = currNode.speed ? ` (${currNode.speed}s act)` : currNode.growth_time ? ` (${currNode.growth_time}s growth)` : '';
      let costText = currNode.cost > 0 ? ` - Cost: ${currNode.cost}g` : ' - FREE';

      box.innerHTML = `
        <div class="flex justify-between text-gray-500 font-bold">
          <span>Mode: ${currentTraversalMode.toUpperCase()}</span>
          <span>Step ${traversalIndex + 1} of ${traversalSequence.length}</span>
        </div>
        <div class="text-emerald-900 font-bold text-xs mt-1">
          👉 ${currNode.name} <span class="font-normal text-gray-600">${statusText}${effectText}${costText}</span>
        </div>
      `;
    }

    function unlockHighlightedNode() {
      if (!traversalActive || traversalSequence.length === 0) return;
      let currNode = traversalSequence[traversalIndex];
      clickUnlockNode(currNode.id);
    }

    start();
  </script>
</body>
</html>
