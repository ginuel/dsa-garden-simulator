<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular 2D Garden Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Game Wrapper Container -->
    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-slate-700">
        
        <!-- Header Navigation Bar -->
        <header class="bg-slate-800 px-6 py-4 flex items-center justify-between border-b border-slate-700">
            <h1 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                🌱 Garden Simulator Suite
            </h1>
            <div class="flex items-center gap-2">
                <button id="prev-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl text-xs transition cursor-pointer active:scale-95 shadow">
                    ◀️ Prev Room
                </button>
                <button id="next-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs transition cursor-pointer active:scale-95 shadow">
                    Next Room ▶️
                </button>
            </div>
        </header>

        <!-- Viewport Container with Bounded Height and Vertical Scroll Support -->
        <main id="game-viewport" class="w-full h-[580px] max-h-[75vh] overflow-y-auto relative bg-slate-50 flex flex-col">
            <!-- Modular rooms dynamically mount here -->
        </main>
        
        <!-- Footer Info Bar -->
        <footer class="bg-slate-900 px-6 py-3 text-xs text-slate-400 flex justify-between items-center border-t border-slate-800">
            <span>Architecture: Modular ES6 / Zero Cross-Room Dependencies</span>
            <span class="text-emerald-400 font-mono">Status: Online</span>
        </footer>
    </div>

    <!-- Main Controller Script Entry Point -->
    <script type="module" src="./main.js"></script>
</body>
</html>
