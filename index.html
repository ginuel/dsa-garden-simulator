<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Garden DSA Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-gray-100 p-4 max-w-lg mx-auto text-gray-800 text-xs space-y-3">

  <header class="text-center space-y-1">
    <h1 class="text-lg font-bold text-emerald-900 flex justify-center items-center gap-1">
      <i data-lucide="sprout" class="w-5 h-5"></i> Garden DSA Simulation
    </h1>
    <div class="flex justify-between items-center bg-amber-100 border border-amber-300 p-2 rounded">
      <span id="status" class="text-amber-700 font-semibold">Initializing Pyodide...</span>
      <span class="font-bold text-amber-900 text-sm flex items-center gap-1">
        <i data-lucide="coins" class="w-4 h-4 text-amber-600"></i> Gold: <span id="gold-val">0</span>
      </span>
    </div>
  </header>

  <main class="space-y-3">
    <!-- 1. STACK -->
    <section class="bg-white p-3 border rounded space-y-1.5">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-emerald-800 flex items-center gap-1">
          <i data-lucide="layers" class="w-3.5 h-3.5"></i> 1. Stack (LIFO Undo)
        </h2>
        <button onclick="undoAction()" class="bg-red-700 text-white px-2 py-0.5 rounded font-bold hover:bg-red-800">Undo</button>
      </div>
      <div id="stack-box" class="font-mono bg-gray-50 p-1.5 border rounded min-h-[28px]">Empty</div>
    </section>

    <!-- 2. QUEUE -->
    <section class="bg-white p-3 border rounded space-y-1.5">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="clock" class="w-3.5 h-3.5"></i> 2. Queue (FIFO Execution)
      </h2>
      <div id="queue-box" class="font-mono bg-gray-50 p-1.5 border rounded min-h-[28px]">Idle</div>
    </section>

    <!-- 3. MATRIX -->
    <section class="bg-white p-3 border rounded space-y-2">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="grid" class="w-3.5 h-3.5"></i> 3. Grid Matrix (3x3 Land)
      </h2>
      <div id="grid-box" class="grid grid-cols-3 gap-1.5 w-fit mx-auto"></div>
      
      <div id="controls" class="hidden bg-emerald-50 p-2 border rounded text-center space-y-1">
        <div id="target-label" class="font-bold text-emerald-900">Selected Plot: (0,0)</div>
        <div class="flex justify-center gap-1.5">
          <button id="btn-soil" onclick="doAction('Soil')" class="bg-amber-800 text-white px-2 py-1 rounded font-semibold hover:bg-amber-900">Soil</button>
          <button id="btn-plant" onclick="doAction('Plant')" class="bg-emerald-600 text-white px-2 py-1 rounded font-semibold hover:bg-emerald-700">Plant</button>
          <button id="btn-water" onclick="doAction('Water')" class="bg-blue-600 text-white px-2 py-1 rounded font-semibold hover:bg-blue-700">Water</button>
        </div>
      </div>
    </section>

    <!-- 4. TREE -->
    <section class="bg-white p-3 border rounded space-y-1.5">
      <h2 class="font-bold text-emerald-800 flex items-center gap-1">
        <i data-lucide="git-branch" class="w-3.5 h-3.5"></i> 4. Skill & Growth Tree
      </h2>
      <div id="tree-box" class="font-mono bg-gray-50 p-2 border rounded space-y-1 overflow-x-auto text-[11px]"></div>
    </section>
  </main>

  <!-- PYTHON CODE WORKBENCH -->
  <section class="bg-white border rounded overflow-hidden">
    <div class="bg-gray-800 text-white px-3 py-1.5 font-bold flex justify-between items-center">
      <span class="flex items-center gap-1">
        <i data-lucide="code" class="w-3.5 h-3.5 text-emerald-400"></i> Python Initializer
      </span>
      <button onclick="runPython()" class="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold hover:bg-emerald-700">Apply Code</button>
    </div>
    <div class="p-2">
      <textarea id="python-code" class="w-full h-40 font-mono bg-gray-900 text-emerald-400 p-2 rounded" spellcheck="false"></textarea>
    </div>
  </section>

  <script>
    let py = null, selectedCell = null, timerRunning = false, gold = 0;
    let history_stack = [], execution_queue = [];
    let plot_matrix = Array(3).fill(null).map(() => 
      Array(3).fill(null).map(() => ({ status: "Empty", timer: 0, timerId: null, hasPlant: false, isWatered: false }))
    );
    let speeds = { Soil: 2.0, Water: 1.0, Plant: 3.0 };
    let growthTime = 5, treeRoot = null;

    const initialPythonCode = `class Node:
    def __init__(self, id_str, name, action=None, speed=None, growth_time=None, cost=10):
        self.id = id_str
        self.name = name
        self.action = action
        self.speed = speed
        self.growth_time = growth_time
        self.cost = cost
        self.unlocked = False
        self.children = []

root = Node("root", "Root Node", cost=0)

soil = Node("soil", "Learned: Soil", "Soil", 2.0, cost=5)
water = Node("water", "Learned: Water", "Water", 1.0, cost=10)
plant = Node("plant", "Learned: Plant", "Plant", 3.0, cost=10)
growth = Node("growth", "Base Growth", growth_time=5, cost=10)

fast_soil = Node("fast_soil", "Fast Soil", "Soil", 1.0, cost=15)
fast_water = Node("fast_water", "Fast Water", "Water", 0.5, cost=15)
fast_plant = Node("fast_plant", "Fast Plant", "Plant", 1.5, cost=15)
fast_growth = Node("fast_growth", "Fast Growth", growth_time=3, cost=20)

super_soil = Node("super_soil", "Super Soil", "Soil", 0.3, cost=30)
super_water = Node("super_water", "Super Water", "Water", 0.2, cost=30)
super_plant = Node("super_plant", "Super Plant", "Plant", 0.5, cost=30)
super_growth = Node("super_growth", "Super Growth", growth_time=1, cost=40)

root.children = [soil, water, plant, growth]
soil.children = [fast_soil]
fast_soil.children = [super_soil]
water.children = [fast_water]
fast_water.children = [super_water]
plant.children = [fast_plant]
fast_plant.children = [super_plant]
growth.children = [fast_growth]
fast_growth.children = [super_growth]

def serialize(node):
    return {
        "id": node.id, "name": node.name, "action": node.action,
        "speed": node.speed, "growth_time": node.growth_time,
        "cost": node.cost, "unlocked": node.unlocked,
        "children": [serialize(c) for c in node.children]
    }

tree = serialize(root)`;

    async function start() {
      document.getElementById('python-code').value = initialPythonCode;
      py = await loadPyodide();
      await runPython();
      document.getElementById('status').innerText = "Pyodide Active";
      document.getElementById('status').className = "text-amber-800 font-semibold";
      drawGrid();
      updateGoldUI();
      lucide.createIcons();
    }

    async function runPython() {
      try {
        await py.runPythonAsync(document.getElementById('python-code').value);
        let rawTree = py.runPython("tree");
        treeRoot = rawTree.toJs({ dict_converter: Object.fromEntries });
        syncTreeEffects();
        drawTree();
      } catch (err) { alert("Python Error: " + err); }
    }

    function updateGoldUI() { document.getElementById('gold-val').innerText = gold; }

    function undoAction() {
      if (history_stack.length > 0) {
        let last = history_stack.pop();
        execution_queue = execution_queue.filter(i => i !== last);
        drawStack(); drawQueue();
      }
    }

    function drawStack() {
      let box = document.getElementById('stack-box');
      if (history_stack.length === 0) { box.innerText = "Empty"; return; }
      box.innerHTML = [...history_stack].reverse().map(i => `<div>• (${i.r},${i.c}): ${i.act}</div>`).join('');
    }

    function doAction(act) {
      if (!selectedCell) return;
      let r = selectedCell.r, c = selectedCell.c, plot = plot_matrix[r][c];

      if (!treeRoot || !treeRoot.unlocked) return alert("Unlock Root Node first!");
      if ((act === 'Water' || act === 'Plant') && plot.status === 'Empty') return alert(`Cannot ${act.toLowerCase()} without Soil!`);

      let task = { r, c, act, time: speeds[act] };
      history_stack.push(task); execution_queue.push(task);
      drawStack(); drawQueue();
      if (!timerRunning) runWorker();
    }

    function runWorker() {
      if (execution_queue.length === 0) { timerRunning = false; drawQueue(); return; }
      timerRunning = true;
      let task = execution_queue[0];
      drawQueue();
      setTimeout(() => {
        let done = execution_queue.shift();
        if (done) applyPlotChange(done.r, done.c, done.act);
        drawGrid(); drawQueue(); runWorker();
      }, task.time * 1000);
    }

    function applyPlotChange(r, c, act) {
      let plot = plot_matrix[r][c];
      if (act === 'Soil') {
        if (plot.timerId) clearInterval(plot.timerId);
        plot_matrix[r][c] = { status: 'Soil', timer: 0, timerId: null, hasPlant: false, isWatered: false };
      } else if (act === 'Plant') {
        plot.status = 'Soil + Plant'; plot.hasPlant = true;
      } else if (act === 'Water') {
        plot.isWatered = true;
        if (plot.hasPlant) {
          plot.status = 'Growing...';
          plot.timer = typeof growthTime === 'number' && !isNaN(growthTime) ? growthTime : 5;
          if (plot.timerId) clearInterval(plot.timerId);
          plot.timerId = setInterval(() => {
            plot.timer--;
            if (plot.timer <= 0) {
              clearInterval(plot.timerId); plot.timerId = null; plot.status = 'Gold Harvestable!';
            }
            drawGrid();
          }, 1000);
        } else { plot.status = 'Watered Soil'; }
      }
    }

    function harvestGold(r, c) {
      gold += 15; updateGoldUI();
      plot_matrix[r][c] = { status: 'Soil', timer: 0, timerId: null, hasPlant: false, isWatered: false };
      drawGrid();
    }

    function drawQueue() {
      let box = document.getElementById('queue-box');
      if (execution_queue.length === 0) { box.innerText = "Idle"; return; }
      box.innerHTML = execution_queue.map((i, idx) => `<div>${idx === 0 ? '►' : '•'} (${i.r},${i.c}): ${i.act} (${i.time}s)</div>`).join('');
    }

    function drawGrid() {
      let box = document.getElementById('grid-box'); box.innerHTML = '';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          let plot = plot_matrix[r][c], isSel = selectedCell && selectedCell.r === r && selectedCell.c === c;
          let isGold = plot.status === 'Gold Harvestable!', btn = document.createElement('button');
          btn.className = `w-16 h-16 rounded text-[10px] font-bold border flex flex-col items-center justify-center p-0.5 transition ${
            isSel ? 'border-amber-500 border-2' : 'border-gray-300'
          } ${
            isGold ? 'bg-amber-400 text-amber-950 animate-pulse' :
            plot.status.includes('Soil') ? 'bg-amber-800 text-amber-100' :
            plot.status.includes('Growing') ? 'bg-emerald-700 text-white' :
            plot.status === 'Watered Soil' ? 'bg-blue-600 text-white' : 'bg-amber-50 text-amber-900'
          }`;
          let subText = plot.status;
          if (plot.status === 'Growing...') subText = `🌱 (${plot.timer}s)`;
          if (isGold) subText = `💰 CLICK!`;
          btn.innerHTML = `(${r},${c})<br><span class="text-[9px] font-normal">${subText}</span>`;
          btn.onclick = () => {
            if (isGold) return harvestGold(r, c);
            selectedCell = { r, c }; drawGrid();
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('target-label').innerText = `Selected Plot: (${r}, ${c})`;
          };
          box.appendChild(btn);
        }
      }
    }

    function syncTreeEffects() {
      if (!treeRoot) return;
      let q = [treeRoot];
      while (q.length > 0) {
        let curr = q.shift();
        if (curr.unlocked) {
          if (curr.action && curr.speed != null && !isNaN(Number(curr.speed))) speeds[curr.action] = Number(curr.speed);
          if (curr.growth_time != null && !isNaN(Number(curr.growth_time))) growthTime = Number(curr.growth_time);
        }
        if (curr.children) q.push(...curr.children);
      }
      document.getElementById('btn-soil').innerText = `Soil (${speeds.Soil}s)`;
      document.getElementById('btn-water').innerText = `Water (${speeds.Water}s)`;
      document.getElementById('btn-plant').innerText = `Plant (${speeds.Plant}s)`;
    }

    function clickUnlockNode(nodeId) {
      if (!treeRoot) return;
      function findAndUnlock(node, parentUnlocked) {
        if (node.id === nodeId) {
          if (node.unlocked) return alert("Already unlocked!");
          if (!parentUnlocked) return alert("Parent node must be ON first.");
          if (gold < node.cost) return alert(`Need ${node.cost} Gold.`);
          gold -= node.cost; node.unlocked = true; updateGoldUI(); return true;
        }
        if (node.children) {
          for (let child of node.children) { if (findAndUnlock(child, node.unlocked)) return true; }
        }
        return false;
      }
      findAndUnlock(treeRoot, true);
      syncTreeEffects(); drawTree();
    }

    function drawTree() {
      if (!treeRoot) return;
      let container = document.getElementById('tree-box'); container.innerHTML = '';
      function render(node, level = 0) {
        let row = document.createElement('div'); row.style.paddingLeft = `${level * 16}px`; row.className = "my-0.5";
        let statusText = node.unlocked ? "[ON]" : "[OFF]";
        let effectText = node.speed ? ` (${node.speed}s act)` : node.growth_time ? ` (${node.growth_time}s growth)` : '';
        let costText = node.cost > 0 ? ` - ${node.cost}g` : ' - FREE';
        let btn = document.createElement('button');
        btn.className = `px-2 py-1 rounded text-left border font-mono text-[11px] transition ${
          node.unlocked ? 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100'
        }`;
        btn.innerHTML = `<b>${statusText}</b> ${node.name}${effectText}${costText}`;
        btn.onclick = () => clickUnlockNode(node.id);
        row.appendChild(btn); container.appendChild(row);
        if (node.children) { for (let c of node.children) render(c, level + 1); }
      }
      render(treeRoot);
    }

    start();
  </script>
</body>
</html>
